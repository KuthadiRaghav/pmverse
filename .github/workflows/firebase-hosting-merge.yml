name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm ci && npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: "pmversestudio.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "pmversestudio"
          VITE_FIREBASE_STORAGE_BUCKET: "pmversestudio.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "783139057211"
          VITE_FIREBASE_APP_ID: "1:783139057211:web:603f9bbed55c15e895361e"
          VITE_FIREBASE_MEASUREMENT_ID: "G-39P3RB7NRB"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PMVERSESTUDIO }}
          channelId: live
          projectId: pmversestudio
